[package]
name = "fortnite-xcloud-pc"
version = "2.0.0"
description = "Fortnite XCloud Gaming Launcher"
authors = ["you"]
edition = "2021"

[lib]
name = "fortnite_xcloud_pc_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
tokio = { version = "1", features = ["sync", "time"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
