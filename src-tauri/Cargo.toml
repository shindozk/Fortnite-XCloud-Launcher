[package]
name = "fortnite-xcloud-launcher"
version = "2.1.0"
description = "Fortnite XCloud Gaming Launcher"
authors = ["shindozk"]
edition = "2024"

[lib]
name = "fortnite_xcloud_launcher_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
tokio = { version = "1", features = ["sync", "time"] }
reqwest = { version = "0.12", features = ["json"] }
discord-rpc-client = "0.4"
once_cell = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
overflow-checks = false
incremental = false
